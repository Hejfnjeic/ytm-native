[workspace]
resolver = "3"
# app: the player. probe: early research tools for YouTube's API. xtask: release helpers.
members = ["app", "probe", "xtask"]
# `cargo run` / `cargo build` / `cargo test` without -p mean the player.
default-members = ["app"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwind, not abort: a panic while handling one request (in a library or a parser)
# must fail that request, not close the app.
panic = "unwind"

# Debug builds: file and line in backtraces, without full debug info, which made the
# build folder grow by many gigabytes.
[profile.dev]
debug = "line-tables-only"

# Keep debug builds usable: optimize dependencies (decoders, egui) even in dev.
[profile.dev.package."*"]
opt-level = 2

# egui's text layout with one change for right-to-left text (#141): see the ytm-rs notes
# in vendor/epaint/src/text/text_layout.rs.
# souvlaki with its Linux media controls sending changes as they happen, not one a
# second (#144): see the ytm-rs notes in vendor/souvlaki/src/platform/mpris/dbus/controls.rs.
# winit with X11 windows taking a scale that changes after they open (#208) and Windows
# throttling move repaints (~30 fps) and skipping duplicate resize paints in the size/move
# loop so dragging and resizing run at the monitor's refresh rate without freezing video:
# see the ytm-rs notes in vendor/winit/src/platform_impl/linux/x11/window.rs and
# vendor/winit/src/platform_impl/windows/event_loop.rs.
# The X11 backend also requests saved window positions explicitly on KWin so the
# full window's size doesn't constrain where the mini player can go.
[patch.crates-io]
epaint = { path = "app/vendor/epaint" }
souvlaki = { path = "app/vendor/souvlaki" }
winit = { path = "app/vendor/winit" }
