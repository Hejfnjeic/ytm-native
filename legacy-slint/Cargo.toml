[package]
name = "ytm-native"
version = "0.3.0"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# Pure-Rust bzip2 (libbz2-rs-sys backend) for applying update patches.
bzip2 = "0.6.1"
chacha20poly1305 = "0.11.0"
cpal = "0.18.2"
dirs = "7.0.0"
hex = "0.4.3"
image = "0.25.10"
rand = "0.10.4"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "http2"] }
rfd = "0.18.0"
roxmltree = "0.21.2"
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sha1 = "0.11.0"
slint = "1.19.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mkv"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.9"
wsola = "0.3.0"

# Linux: KWallet/Secret Service for the login key, MPRIS, system libopus, glibc malloc_trim.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = "4.2.0"
libc = "0.2.191"
mpris-server = "0.11.0"
opusic-sys = { version = "0.7.7", default-features = false }

# Windows: DPAPI for the login key (not the Credential Manager), libopus built from source,
# media controls.
[target.'cfg(windows)'.dependencies]
opusic-sys = { version = "0.7.7", default-features = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
# Media controls (SMTC). Microsoft's Rust bindings to WinRT: no compiled C/C++.
windows = { version = "0.62.2", features = ["Foundation", "Media", "Media_Playback", "Storage_Streams"] }

[dev-dependencies]
# Makes the bsdiff patches the updater's test applies (compiles C; never in the app itself).
qbsdiff = "1.4.4"

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "1.19.0"
